<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Freshness lifecycle: anchor -> probe -> log -> ternary verdict -> successor -->
  <g>
    <rect x="20" y="52" width="216" height="126" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="40" y="84" font-size="14" font-weight="600" fill="#1f2328">anchor</text>
    <text x="40" y="110" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">system: repo-a</text>
    <text x="40" y="132" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">kind: git_ref</text>
    <text x="40" y="154" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">payload: {ref, commit}</text>
  </g>
  <path d="M 236 115 L 288 115" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow-light)"/>
  <rect x="292" y="101" width="76" height="28" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="330" y="119" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">probe</text>
  <path d="M 368 115 L 420 115" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow-light)"/>
  <g>
    <rect x="424" y="85" width="196" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="522" y="110" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">verdicts.jsonl</text>
    <text x="522" y="130" font-size="11.5" text-anchor="middle" fill="#59636e">append-only history</text>
  </g>
  <path d="M 620 115 C 646 115, 646 54, 672 54" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow-light)"/>
  <path d="M 620 115 L 672 115" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow-light)"/>
  <path d="M 620 115 C 646 115, 646 176, 672 176" stroke="#59636e" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow-light)"/>
  <g>
    <rect x="676" y="40" width="110" height="28" rx="14" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="731" y="58" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a7f37">current</text>
    <text x="798" y="58" font-size="12" fill="#59636e">still matches</text>
    <rect x="676" y="101" width="110" height="28" rx="14" fill="none" stroke="#cf222e" stroke-width="1.5"/>
    <text x="731" y="119" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cf222e">drifted</text>
    <text x="798" y="119" font-size="12" fill="#59636e">the world moved</text>
    <rect x="676" y="162" width="110" height="28" rx="14" fill="none" stroke="#59636e" stroke-width="1.5"/>
    <text x="731" y="180" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#59636e">unknown</text>
    <text x="798" y="180" font-size="12" fill="#59636e">could not tell — says so</text>
  </g>
  <path d="M 731 129 C 731 210, 640 240, 546 240" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#lc-arrow-red-light)"/>
  <rect x="290" y="225" width="252" height="30" rx="15" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="416" y="244" font-size="12.5" text-anchor="middle" fill="#1f2328">a successor unit supersedes it</text>
  <path d="M 290 240 C 200 240, 128 220, 128 182" stroke="#59636e" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#lc-arrow-light)"/>
  <text x="128" y="200" font-size="11" fill="#59636e"> </text>
  <text x="560" y="264" font-size="11.5" fill="#59636e">history is never edited: re-probing appends, correcting supersedes</text>
  <defs>
    <marker id="lc-arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#59636e"/>
    </marker>
    <marker id="lc-arrow-red-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#cf222e"/>
    </marker>
  </defs>
</svg>
