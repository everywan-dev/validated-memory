<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Freshness lifecycle: anchor -> probe -> log -> ternary verdict -> successor -->
  <g>
    <rect x="20" y="52" width="216" height="126" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="40" y="84" font-size="14" font-weight="600" fill="#e6edf3">anchor</text>
    <text x="40" y="110" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">system: repo-a</text>
    <text x="40" y="132" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">kind: git_ref</text>
    <text x="40" y="154" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">payload: {ref, commit}</text>
  </g>
  <path d="M 236 115 L 288 115" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow)"/>
  <rect x="292" y="101" width="76" height="28" rx="14" fill="#0d1117" stroke="#4493f8" stroke-width="1.5"/>
  <text x="330" y="119" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4493f8">probe</text>
  <path d="M 368 115 L 420 115" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow)"/>
  <g>
    <rect x="424" y="85" width="196" height="60" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="522" y="110" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">verdicts.jsonl</text>
    <text x="522" y="130" font-size="11.5" text-anchor="middle" fill="#9198a1">append-only history</text>
  </g>
  <path d="M 620 115 C 646 115, 646 54, 672 54" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow)"/>
  <path d="M 620 115 L 672 115" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow)"/>
  <path d="M 620 115 C 646 115, 646 176, 672 176" stroke="#9198a1" stroke-width="1.5" fill="none" marker-end="url(#lc-arrow)"/>
  <g>
    <rect x="676" y="40" width="110" height="28" rx="14" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="731" y="58" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3fb950">current</text>
    <text x="798" y="58" font-size="12" fill="#9198a1">still matches</text>
    <rect x="676" y="101" width="110" height="28" rx="14" fill="none" stroke="#f85149" stroke-width="1.5"/>
    <text x="731" y="119" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f85149">drifted</text>
    <text x="798" y="119" font-size="12" fill="#9198a1">the world moved</text>
    <rect x="676" y="162" width="110" height="28" rx="14" fill="none" stroke="#9198a1" stroke-width="1.5"/>
    <text x="731" y="180" font-size="12.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#9198a1">unknown</text>
    <text x="798" y="180" font-size="12" fill="#9198a1">could not tell — says so</text>
  </g>
  <path d="M 731 129 C 731 210, 640 240, 546 240" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#lc-arrow-red)"/>
  <rect x="290" y="225" width="252" height="30" rx="15" fill="#0d1117" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="416" y="244" font-size="12.5" text-anchor="middle" fill="#e6edf3">a successor unit supersedes it</text>
  <path d="M 290 240 C 200 240, 128 220, 128 182" stroke="#9198a1" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#lc-arrow)"/>
  <text x="128" y="200" font-size="11" fill="#9198a1"> </text>
  <text x="560" y="264" font-size="11.5" fill="#9198a1">history is never edited: re-probing appends, correcting supersedes</text>
  <defs>
    <marker id="lc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#9198a1"/>
    </marker>
    <marker id="lc-arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f85149"/>
    </marker>
  </defs>
</svg>
