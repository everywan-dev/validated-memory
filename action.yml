name: validated-memory
description: >-
  Gate a repository on its validated-memory method: structural consistency
  always, freshness only where the adopter opts in.
inputs:
  args:
    description: >-
      Whitespace-separated flags passed to `status`, e.g.
      "--skip-index --fail-on drifted --max-verdict-age 30 --fail-on-aged".
      Split on whitespace only -- shell quoting is not interpreted. No
      `status` flag needs a value with spaces (timestamps are ISO 8601
      with a `T`).
    required: false
    default: ""
  python-version:
    description: Python used to run the CLI (stdlib only; any supported 3.x).
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: validated-memory status
      shell: bash
      # `args` goes through the environment, never interpolated into the
      # script: `${{ }}` inside `run:` would let a crafted input inject
      # shell. Unquoted `$ARGS` is the point -- it word-splits into flags
      # -- and `set -f` keeps that split from also globbing against the
      # workspace.
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -f
        PYTHONPATH="$GITHUB_ACTION_PATH" python3 -P -m validated_memory status $ARGS
