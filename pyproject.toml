[project]
name = "validated-memory"
version = "2.5.1"
description = "Validated memory for agent projects: evidence states, supersession without deletion, freshness probes with a ternary verdict."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
# The plugin ships skills/ and hooks/ as top-level data directories; only
# validated_memory/ (and its subpackages) is the installable Python package.
include = ["validated_memory*"]

[tool.pytest.ini_options]
# Collection is limited to the suite roots, so working directories elsewhere
# in a clone never enter `python -m pytest`.
testpaths = ["tests", "evaluations"]
